# RapidGo V4 - Riesgo transaccional
# Semana 1 (preliminar): Kafka en modo KRaft (sin Zookeeper) + creación del topic + Kafka UI.
# Semana 2: productor de eventos y Spark Structured Streaming (imagen propia, ver Dockerfile).
# Semana 3: se agregan PostgreSQL y Airflow (servidor web y planificador).

name: rapidgo-v4

services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: rg4-kafka
    hostname: kafka
    ports:
      - "29092:29092"            # acceso desde el computador anfitrión (productor local / pruebas)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.8.0
    container_name: rg4-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
          --topic rapidgo.v4.pagos.intentos --partitions 3 --replication-factor 1 \
          --config retention.ms=604800000
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --describe \
          --topic rapidgo.v4.pagos.intentos
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rg4-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rapidgo-v4
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  # ---------------------------------------------------------------- Semana 2
  # Trabajo de Spark: Kafka → datalake/raw, processed y curated (Parquet + checkpoints).
  spark:
    build: .
    image: rapidgo-v4-app
    container_name: rg4-spark
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    command: ["python", "-m", "spark.streaming_pagos"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: rapidgo.v4.pagos.intentos
      RUTA_DATALAKE: /app/datalake
      INICIO_OFFSETS: earliest
      INTERVALO_LOTE: ${INTERVALO_LOTE:-10 seconds}
      RETRASO_MAXIMO: ${RETRASO_MAXIMO:-2 minutes}   # marca de agua; ver docs/decisions/ADR-002
      SPARK_DRIVER_MEMORY: 1g
      SPARK_IVY_DIR: /root/.ivy2        # caché del conector de Kafka descargado de Maven
    ports:
      - "4040:4040"                     # interfaz web de Spark (pestaña Structured Streaming)
    volumes:
      - ./datalake:/app/datalake
      - ./spark:/app/spark:ro           # el código se lee de la carpeta: no hay que reconstruir al editar
      - ./scripts:/app/scripts:ro
      - spark-ivy:/root/.ivy2

  # Productor de intentos de pago (clave id_pedido, ~5 % de pedidos anómalos).
  productor:
    image: rapidgo-v4-app
    container_name: rg4-productor
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      spark:
        condition: service_started
    command: >
      python -m producer.productor_pagos
      --eventos-por-segundo ${EVENTOS_POR_SEGUNDO:-10}
      --duracion ${DURACION_PRODUCTOR:-0}
      --resumen /app/datalake/_metricas/productor_resumen.json
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: rapidgo.v4.pagos.intentos
    volumes:
      - ./datalake:/app/datalake
      - ./producer:/app/producer:ro
      - ./samples:/app/samples:ro
    restart: "no"

volumes:
  spark-ivy:
